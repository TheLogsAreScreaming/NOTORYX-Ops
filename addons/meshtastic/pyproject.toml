[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notoryx-ops-meshtastic"
version = "0.1.6"
description = "Meshtastic add-on for NOTORYX Ops: remote admin, templates, compliance checks and a MeshCore bridge"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "notoryx-ops>=0.1.6",
  "meshtastic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.entry-points."notoryx_ops.addons"]
meshtastic = "notoryx_ops_meshtastic:addon"

[tool.hatch.build.targets.wheel]
packages = ["src/notoryx_ops_meshtastic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
