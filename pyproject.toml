[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notoryx-ops"
version = "0.1.18"
description = "MeshCore network dashboard and infrastructure station"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "meshcore>=2.3.19,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=12,<16",
  "paho-mqtt>=2.1,<3",
  "pycryptodome>=3.20,<4",
  "numpy>=1.26,<3",
  "certifi>=2024.2.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
notoryx-ops = "notoryx_ops.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notoryx_ops"]

# The built dashboard is copied into src/notoryx_ops/web before packaging (gitignored).
artifacts = ["src/notoryx_ops/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
