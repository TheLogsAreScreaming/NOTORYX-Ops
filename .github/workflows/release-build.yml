name: Release build

# Builds every download for one version. Publishing to NOTORYX-Ops-Releases is done
# by hand from the artifact, as the repo owner.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dashboard
        run: cd web && npm ci && npm run build
      - name: Tests
        run: pip install -e ".[dev]" && pytest -q
      - name: Wheel
        id: wheel
        run: |
          rm -rf src/notoryx_ops/web && cp -R web/dist src/notoryx_ops/web
          pip install build
          python -m build --wheel --sdist --outdir dist
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          unzip -l dist/*.whl | grep -q "notoryx_ops/web/index.html"
      - name: Bundles
        run: |
          mkdir -p out
          V=$VERSION
          WHL=$(ls dist/*.whl)
          cp "$WHL" out/
          cp dist/*.tar.gz out/notoryx-ops-$V-source.tar.gz
          mkdir -p pi/notoryx-ops-$V-pi && cp "$WHL" packaging/pi/install.sh pi/notoryx-ops-$V-pi/
          tar -C pi -czf out/notoryx-ops-$V-pi.tar.gz notoryx-ops-$V-pi
          mkdir -p dk/notoryx-ops-$V-docker && cp "$WHL" packaging/docker/Dockerfile packaging/docker/docker-compose.yml dk/notoryx-ops-$V-docker/
          (cd dk && zip -qr ../out/notoryx-ops-$V-docker.zip notoryx-ops-$V-docker)
      - uses: actions/upload-artifact@v4
        with:
          name: parts-linux
          path: out/*
          retention-days: 2
    outputs:
      version: ${{ steps.wheel.outputs.version }}

  mac:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: parts-linux
          path: parts
      - name: Mac app
        run: |
          V=${{ needs.build.outputs.version }}
          mkdir -p mac out
          macos/build-app.sh parts/notoryx_ops-$V-py3-none-any.whl mac
          lipo -archs "mac/NOTORYX Ops.app/Contents/MacOS/NOTORYX Ops"
          codesign -v "mac/NOTORYX Ops.app"
          ditto -c -k --keepParent "mac/NOTORYX Ops.app" out/notoryx-ops-$V-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: parts-mac
          path: out/*
          retention-days: 2

  collect:
    needs: [build, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parts-*
          merge-multiple: true
          path: out
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: notoryx-ops-${{ needs.build.outputs.version }}
          path: out/*
          retention-days: 7
