name: Retry stuck Mac jobs

# GitHub sometimes never gives a Mac job a runner; after 15 minutes the job is cancelled
# without running a single step. Re-run those jobs (up to twice) instead of waiting for
# someone to notice. Jobs that ran and really failed are left alone.
on:
  workflow_run:
    workflows: ["CI", "Release build"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run Mac jobs that never started
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN/jobs")
          stuck=$(echo "$jobs" | jq '[.jobs[] | select(.name | test("mac"; "i")) | select(.conclusion == "cancelled" or .conclusion == "failure") | select((.steps | length) == 0)] | length')
          # A run cancelled because a newer push replaced it has other jobs cancelled too: leave those alone.
          others=$(echo "$jobs" | jq '[.jobs[] | select(.name | test("mac"; "i") | not) | select(.conclusion == "cancelled" or .conclusion == "failure")] | length')
          echo "Mac jobs that never started: $stuck, other failed or cancelled jobs: $others"
          if [ "$stuck" -gt 0 ] && [ "$others" -eq 0 ]; then
            gh run rerun "$RUN" --failed -R "$REPO"
          fi
